[project]
name = "agentic-sabotage"
version = "0.1.0"
description = "Mechanistic Debugging of Agentic Sabotage & Tool-Call Hallucinations via Gemma Scope SAEs and Linear Probes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "google-genai>=1.0.0",
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
    "huggingface-hub>=0.26.0",
    "safetensors>=0.4.5",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "tqdm>=4.66.0",
    "pydantic>=2.9.0",
    "rich>=13.8.0",
]

[project.scripts]
sabotage = "agentic_sabotage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_sabotage"]
